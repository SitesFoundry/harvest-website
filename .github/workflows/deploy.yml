name: Build and deploy to GitHub Pages

# Publishes dist/ to GitHub Pages. Required one-time setup in the repository:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# SITE_BASE is "/" because the site is served from the root of www.harvest.cn.
#
# The project-site preview (https://<owner>.github.io/harvest-website/) no longer
# works as a result: with "/" its assets are requested from the domain root, where
# they do not exist. That preview was a staging device and its job is done.
#
# src/App.tsx and src/lib/asset.ts both read this one value, so the router prefix
# and the asset paths follow it together and cannot disagree. The canonical host
# is www.harvest.cn — see the README's "Canonical host" section.
#
# The Formspree form id is committed in src/lib/form.ts, because it is a public
# value anyway (it is in the endpoint URL of every submission). Setting this
# variable is OPTIONAL and only overrides that default — for pointing a build at
# a separate test form. Leaving FORMSPREE_ID unset is the normal case.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  SITE_BASE: /
  VITE_FORMSPREE_ID: ${{ vars.FORMSPREE_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build the site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the build output
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
