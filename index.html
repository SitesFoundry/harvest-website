<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />
    <meta name="theme-color" content="#0d2b28" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="description" content="B2B supplier of N-type TOPCon solar modules, hybrid inverters and battery storage from 1 kWh to 5 MWh. OEM support, export logistics, 50+ markets." />
    <meta name="keywords" content="solar module supplier, TOPCon bifacial solar modules, solar module wholesale, hybrid inverter supplier, BESS supplier, battery energy storage system, portable power station, home battery, commercial storage, utility-scale storage, OEM solar modules, private label solar, FRP module frame, PV cable, MC4 connector" />
    <meta name="author" content="Harvest Eco Solutions Limited" />
    <link rel="canonical" href="https://www.harvest.cn/" />
    <!--
      No hreflang alternates, deliberately.

      All three languages are served by this one URL. The language is client
      state — chosen from localStorage, seeded from the browser's own
      preference — and nothing in the application ever read a ?lang= parameter,
      so the alternates that used to sit here pointed at URLs that behaved
      identically to this one AND canonicalised back to it. Google requires an
      hreflang target to be self-canonical; these were not, so at best they were
      ignored and at worst they produced "hreflang conflicts with canonical"
      warnings while adding three duplicate URLs per page to the crawl queue.

      Genuine alternates need genuinely separate URLs (/en/, /es/, /fr/), which
      is an architecture change, not a meta-tag change.
    -->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Harvest Eco Solutions Limited" />
    <meta property="og:title" content="Solar Modules & BESS Supplier | Harvest Eco Solutions" />
    <meta property="og:description" content="B2B supply of N-type TOPCon solar modules, hybrid inverters and battery storage from 1 kWh to 5 MWh, with OEM support and export logistics." />
    <meta property="og:url" content="https://www.harvest.cn/" />
    <!--
      og:image and twitter:image must be ABSOLUTE URLs — scrapers do not resolve
      relative ones. These point at this site's own /images/ so the card keeps
      working now that the former image CDN is gone.
    -->
    <meta property="og:image" content="https://www.harvest.cn/images/harvest-hero-solar-ai.webp" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:locale:alternate" content="fr_FR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Solar Modules & BESS Supplier | Harvest Eco Solutions" />
    <meta name="twitter:description" content="B2B supply of N-type TOPCon solar modules, hybrid inverters and battery storage from 1 kWh to 5 MWh, with OEM support and export logistics." />
    <meta name="twitter:image" content="https://www.harvest.cn/images/harvest-hero-solar-ai.webp" />

    <title>Solar Modules & BESS Supplier | Harvest Eco Solutions</title>

    <!--
      The favicon and the web-app manifest used to be supplied by the hosting
      platform rather than by the project. Both are now files in this repository.
      Vite rewrites these root-relative paths to match SITE_BASE, so they resolve
      under the preview sub-path as well.
    -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      Carlito is self-hosted (public/fonts). It used to come from Google Fonts,
      which was the only third-party request on the site and is unreliable or
      blocked for visitors in mainland China; a blocked stylesheet also delays
      first paint. Both weights are preloaded because the hero headline and body
      copy are visible in the first viewport.
    -->
    <link rel="preload" href="/fonts/carlito-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/carlito-700.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The home and contact heroes use this photograph; discovering it here
         lets the browser start before the JavaScript bundle runs. -->
    <link rel="preload" href="/images/harvest-hero-solar-ai.webp" as="image" fetchpriority="high" />

    <!--
      No Product markup here on purpose. Google's Product rich result requires an
      offer, a review or an aggregateRating; this is a B2B supplier whose price
      depends on model, quantity and destination. Publishing a fake price or a
      rating would mislead buyers, so the catalogue is expressed as an ItemList of
      product pages on each product page instead. See src/lib/seo.ts.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://www.harvest.cn/#organization",
        "name": "Harvest Eco Solutions Limited",
        "url": "https://www.harvest.cn/",
        "logo": "https://www.harvest.cn/images/harvest-logo.png",
        "foundingDate": "2004",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Industrial Development Zone, Fengxian Dist.",
          "addressLocality": "Shanghai",
          "postalCode": "201404",
          "addressCountry": "CN"
        },
        "email": "sales@harvest.cn",
        "telephone": "+8613916169339",
        "areaServed": "Worldwide",
        "slogan": "Solar systems and AI intelligent energy-saving solutions for global markets.",
        "knowsLanguage": ["en", "es", "fr"],
        "description": "Harvest Eco Solutions Limited provides solar systems, BESS, photovoltaic accessories and AI smart energy-saving control solutions for customers worldwide.",
        "contactPoint": [
          {
            "@type": "ContactPoint",
            "contactType": "sales",
            "email": "sales@harvest.cn",
            "telephone": "+8613916169339",
            "areaServed": "Worldwide",
            "availableLanguage": ["en", "es", "fr"]
          }
        ],
        "knowsAbout": [
          "Solar modules",
          "Inverters",
          "Energy storage systems",
          "AI smart control",
          "Photovoltaic cables",
          "MC4 connectors",
          "International trade and logistics"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://www.harvest.cn/#website",
        "name": "Harvest Eco Solutions Limited",
        "url": "https://www.harvest.cn/",
        "inLanguage": ["en", "es", "fr"],
        "publisher": {
          "@type": "Organization",
          "name": "Harvest Eco Solutions Limited"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <!--
      Genuine fallback for visitors and crawlers that do not run JavaScript.
      scripts/postbuild.mjs replaces this block on every sub-page with that
      page's own title, description and breadcrumb, so the text is never the
      home-page copy repeated eight times. It is visible text for a no-JS
      visitor, not hidden keyword padding.
    -->
    <noscript id="no-js-summary">
      <div class="no-js-summary">
        <h1>Solar Modules &amp; BESS Supplier | Harvest Eco Solutions</h1>
        <p>B2B supplier of N-type TOPCon solar modules, hybrid inverters and battery storage from 1 kWh to 5 MWh. OEM support, export logistics, 50+ markets.</p>
        <p><a href="/">Home</a> · <a href="/about/">About</a> · <a href="/products/">Products</a> · <a href="/contact/">Contact</a></p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      The platform's analytics beacon and its host-injected runtime used to load
      here. Both are gone with the migration. See the README for the one
      remaining third-party request (Google Fonts).
    -->
  </body>
</html>
