<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>BESS | Harvest Eco Solutions Limited</title>
    <!--
      The energy storage page lives at /products/bess/ — the catalogue reads
      "BESS", so the path does too. This file keeps the old path working: it was
      the live URL until 2026-10-04 and may be in a search index or in a link
      someone kept. GitHub Pages cannot answer with a 301 for a static file, so
      it answers with this page and a meta refresh, which is the closest a static
      host can do. The canonical points at the real page, and the page says
      noindex so the redirect source stays out of the index.
    -->
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://www.harvest.cn/products/bess/" />
    <meta http-equiv="refresh" content="0; url=/products/bess/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #faf7ef;
        color: #10201f;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      p {
        max-width: 34rem;
        line-height: 1.7;
        text-align: center;
        padding: 2rem;
      }
      a {
        color: #0d6b54;
        font-weight: 650;
      }
    </style>
  </head>
  <body>
    <p>
      The battery energy storage page has moved to
      <a href="/products/bess/">harvest.cn/products/bess/</a>.
    </p>
    <script>
      location.replace("/products/bess/");
    </script>
  </body>
</html>
